<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototyp: Positionen im Hochformat</title>
<!-- Diese Datei in denselben Ordner wie logo.png, logo2.png, Zurueck.png, Stopp.png, Vor.png und Juni.jpg legen.
     Fehlende Bilder werden durch Platzhalter ersetzt. -->
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#1c1e24; color:#e8eaf0; font:14px/1.4 system-ui, sans-serif; }
  #app { display:flex; gap:20px; padding:12px; min-height:100%; align-items:flex-start; justify-content:center; }
  #frame { position:relative; flex:none; border-radius:10px; overflow:hidden; box-shadow:0 0 0 1px #3a3e4a; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; overflow:hidden;
    background:url(Juni.jpg) center/cover no-repeat, linear-gradient(160deg,#2b4a7a,#142038 70%); }
  .el { position:absolute; transform:translate(-50%,-50%); }
  .el img, .sg img { display:block; height:auto; max-width:none; user-select:none; -webkit-user-drag:none; }
  .sg { display:flex; align-items:center; }
  .sw { position:relative; display:flex; }
  #credit, #imp { color:#fff; font-size:var(--small); line-height:1.2; white-space:nowrap; text-shadow:0 .08em .25em rgba(0,0,0,.85); }
  #credit { position:absolute; left:50%; top:100%; transform:translateX(-50%); pointer-events:none; }
  #imp { position:absolute; transform:translate(-50%,-50%); text-decoration:none; cursor:grab; touch-action:none; padding:.3em .6em; outline:1px dashed rgba(255,255,255,.55); outline-offset:-1px; }
  #imp.drag { cursor:grabbing; }

  #panel { width:320px; flex:none; display:flex; flex-direction:column; gap:16px; }
  fieldset { border:1px solid #3a3e4a; border-radius:8px; margin:0; padding:10px 12px 12px; }
  legend { padding:0 6px; font-weight:600; }
  .row { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .row label { width:92px; flex:none; }
  select, input[type=number], button { font:inherit; color:inherit; background:#2a2d36; border:1px solid #4a4f5e; border-radius:6px; padding:6px 8px; }
  select { flex:1; }
  button { cursor:pointer; }
  button:hover { background:#343846; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; }
  .seg button.on { background:#3d5fa8; border-color:#6f8fe0; }
  input[type=range] { flex:1; min-width:0; }
  input[type=number] { width:74px; }
  pre { margin:0; padding:10px; background:#12141a; border:1px solid #3a3e4a; border-radius:6px; font:12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space:pre-wrap; }
  .hint { margin:8px 0 0; color:#a2a8b8; font-size:12px; }
  @media (max-width:780px) { #app { flex-direction:column; align-items:center; } #panel { width:100%; max-width:420px; } }
</style>
</head>
<body>
<div id="app">
  <div id="frame">
    <div id="stage">
      <div class="el" id="eLogo"><img id="iLogo" src="logo.png" alt="Logo"></div>
      <div class="el" id="eLogo2"><img id="iLogo2" src="logo2.png" alt="Logo 2"></div>
      <div class="el" id="eSyms"><div class="sg">
        <img id="iBack" src="Zurueck.png" alt="Zurück">
        <span class="sw"><img id="iStop" src="Stopp.png" alt="Stopp"><span id="credit">Foto: Name, Klasse</span></span>
        <img id="iNext" src="Vor.png" alt="Vor">
      </div></div>
      <a id="imp" href="#">Impressum</a>
    </div>
  </div>

  <div id="panel">
    <fieldset>
      <legend>Designendpunkt</legend>
      <div class="seg" id="epSeg">
        <button type="button" data-ep="schmal">Schmal 394 × 734</button>
        <button type="button" data-ep="ipad">iPad hoch 810 × 948</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Anordnung</legend>
      <div id="slots"></div>
      <div class="row">
        <button type="button" id="next" style="flex:1">Nächste Anordnung</button>
        <button type="button" id="orig" style="flex:1">Original</button>
      </div>
      <div class="row"><label for="clamp" style="width:auto"><input type="checkbox" id="clamp"> im Bildrand halten</label></div>
      <p class="hint">Getauscht werden nur die Mittelpunkt-Positionen; Größen bleiben wie im Original.</p>
    </fieldset>

    <fieldset>
      <legend>Impressum</legend>
      <div class="row"><label for="rx">Waagerecht</label><input type="range" id="rx" min="0" max="100" step="0.1"><input type="number" id="nx" min="0" max="100" step="0.1"></div>
      <div class="row"><label for="ry">Senkrecht</label><input type="range" id="ry" min="0" max="100" step="0.1"><input type="number" id="ny" min="0" max="100" step="0.1"></div>
      <div class="row"><button type="button" id="impReset">Zurücksetzen</button></div>
      <p class="hint">Der Schriftzug lässt sich auch direkt im Bild ziehen. Werte in % der Bühne, Mittelpunkt.</p>
    </fieldset>

    <fieldset>
      <legend>Werte zum Übernehmen</legend>
      <pre id="out"></pre>
      <div class="row"><button type="button" id="copy">Kopieren</button></div>
    </fieldset>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const NAMES = { logo:"Logo.png", syms:"Steuersymbole", logo2:"Logo2.png" };
const SLOTNAMES = ["Oben links", "Unten links", "Unten rechts"];   /* Plätze wie im Original */
const ORIGINAL = ["logo", "syms", "logo2"];                         /* Besetzung der Plätze im Original */
const EP = {
  schmal:{ W:394, H:734, label:"Hochformat schmal (394 × 734)", small:2.58,
    slots:[{x:23.2,y:5},{x:23,y:95.1},{x:86.5,y:94.8}],
    w:{logo:40, logo2:25, back:7, stop:9, next:7, gap:2}, imp:{x:81.1,y:98} },
  ipad:{ W:810, H:948, label:"Hochformat iPad (810 × 948)", small:1.48,
    slots:[{x:13,y:3.5},{x:14,y:94.8},{x:88.1,y:93.8}],
    w:{logo:25, logo2:20, back:3.7, stop:4.94, next:3.7, gap:1.23}, imp:{x:82.4,y:97.7} }
};
const PERMS = [[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]].map(p => p.map(i => ORIGINAL[i]));

let ep = "schmal", assign = ORIGINAL.slice(), clampOn = false;
const imp = { schmal:{...EP.schmal.imp}, ipad:{...EP.ipad.imp} };
const ELS = { logo:$("eLogo"), syms:$("eSyms"), logo2:$("eLogo2") };
const n1 = v => +(+v).toFixed(1);

/* Platzhalter, falls ein Bild nicht gefunden wird */
const svg = (w, h, inner) => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`);
const box = t => svg(160, 100, `<rect x="2" y="2" width="156" height="96" rx="12" fill="rgba(255,255,255,.18)" stroke="#fff" stroke-width="3"/><text x="80" y="56" fill="#fff" font-family="sans-serif" font-size="18" text-anchor="middle">${t}</text>`);
const ico = s => svg(100, 100, `<circle cx="50" cy="50" r="46" fill="rgba(255,255,255,.2)" stroke="#fff" stroke-width="4"/><text x="50" y="64" fill="#fff" font-family="sans-serif" font-size="40" text-anchor="middle">${s}</text>`);
const PH = { iLogo:box("logo.png"), iLogo2:box("logo2.png"), iBack:ico("◀"), iStop:ico("❚❚"), iNext:ico("▶") };
Object.keys(PH).forEach(id => {
  const img = $(id);
  img.onerror = () => { img.onerror = null; img.src = PH[id]; };
  img.onload = () => layout();
});

function layout() {
  const E = EP[ep], vw = E.W / 100;
  const stage = $("stage");
  stage.style.width = E.W + "px"; stage.style.height = E.H + "px";
  stage.style.setProperty("--small", E.small * vw + "px");
  const wd = (id, v) => $(id).style.width = v * vw + "px";
  wd("iLogo", E.w.logo); wd("iLogo2", E.w.logo2); wd("iBack", E.w.back); wd("iStop", E.w.stop); wd("iNext", E.w.next);
  document.querySelector(".sg").style.gap = E.w.gap * vw + "px";
  assign.forEach((k, i) => {
    const el = ELS[k], s = E.slots[i];
    let x = s.x * vw, y = s.y * E.H / 100;
    if (clampOn) {
      const w = el.offsetWidth, h = el.offsetHeight;
      x = Math.min(Math.max(x, w / 2), E.W - w / 2);
      y = Math.min(Math.max(y, h / 2), E.H - h / 2);
    }
    el.style.left = x + "px"; el.style.top = y + "px";
  });
  const p = imp[ep], im = $("imp");
  im.style.left = p.x * vw + "px"; im.style.top = p.y * E.H / 100 + "px";
  fit(); ui();
}

let scale = 1;
function fit() {
  const E = EP[ep], narrow = innerWidth <= 780;
  const availW = narrow ? innerWidth - 24 : innerWidth - 24 - 320 - 20;
  const availH = narrow ? innerHeight * 0.72 : innerHeight - 24;
  scale = Math.min(availW / E.W, availH / E.H, 1.5);
  $("stage").style.transform = "scale(" + scale + ")";
  $("frame").style.width = E.W * scale + "px"; $("frame").style.height = E.H * scale + "px";
}

function ui() {
  document.querySelectorAll("#epSeg button").forEach(b => b.classList.toggle("on", b.dataset.ep === ep));
  [...$("slots").querySelectorAll("select")].forEach((s, i) => s.value = assign[i]);
  const p = imp[ep];
  $("rx").value = $("nx").value = n1(p.x); $("ry").value = $("ny").value = n1(p.y);
  $("clamp").checked = clampOn;
  let t = "";
  Object.keys(EP).forEach(k => {
    const E = EP[k];
    t += E.label + "\n";
    ["logo", "syms", "logo2"].forEach(key => { const s = E.slots[assign.indexOf(key)]; t += NAMES[key] + ": x " + n1(s.x) + ", y " + n1(s.y) + "\n"; });
    t += "Impressum: x " + n1(imp[k].x) + ", y " + n1(imp[k].y) + "\n\n";
  });
  $("out").textContent = t.trim();
}

/* Auswahlfelder: Wer ein Element auf einen Platz legt, tauscht mit dem bisherigen Besitzer */
SLOTNAMES.forEach((name, i) => {
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = '<label>' + name + '</label><select>' + Object.keys(NAMES).map(k => '<option value="' + k + '">' + NAMES[k] + '</option>').join("") + '</select>';
  row.querySelector("select").onchange = e => {
    const j = assign.indexOf(e.target.value);
    [assign[i], assign[j]] = [assign[j], assign[i]];
    layout();
  };
  $("slots").appendChild(row);
});
$("next").onclick = () => {
  const cur = PERMS.findIndex(p => p.every((k, i) => k === assign[i]));
  assign = PERMS[(cur + 1) % PERMS.length].slice(); layout();
};
$("orig").onclick = () => { assign = ORIGINAL.slice(); layout(); };
$("clamp").onchange = e => { clampOn = e.target.checked; layout(); };
document.querySelectorAll("#epSeg button").forEach(b => b.onclick = () => { ep = b.dataset.ep; layout(); });

/* Impressum: Regler, Zahlenfelder und Ziehen im Bild */
const setImp = (x, y) => {
  imp[ep].x = Math.min(100, Math.max(0, x)); imp[ep].y = Math.min(100, Math.max(0, y)); layout();
};
["rx", "nx"].forEach(id => $(id).oninput = e => setImp(parseFloat(e.target.value) || 0, imp[ep].y));
["ry", "ny"].forEach(id => $(id).oninput = e => setImp(imp[ep].x, parseFloat(e.target.value) || 0));
$("impReset").onclick = () => { imp[ep] = { ...EP[ep].imp }; layout(); };
const im = $("imp");
im.onclick = e => e.preventDefault();
im.onpointerdown = e => { e.preventDefault(); im.setPointerCapture(e.pointerId); im.classList.add("drag"); };
im.onpointermove = e => {
  if (!im.hasPointerCapture(e.pointerId)) return;
  const r = $("frame").getBoundingClientRect();
  setImp((e.clientX - r.left) / r.width * 100, (e.clientY - r.top) / r.height * 100);
};
im.onpointerup = im.onpointercancel = e => { im.classList.remove("drag"); };

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").textContent); $("copy").textContent = "Kopiert"; }
  catch (err) { const r = document.createRange(); r.selectNodeContents($("out")); getSelection().removeAllRanges(); getSelection().addRange(r); $("copy").textContent = "Markiert – bitte kopieren"; }
  setTimeout(() => $("copy").textContent = "Kopieren", 1800);
};
addEventListener("resize", () => { fit(); });
layout();
</script>
</body>
</html>
